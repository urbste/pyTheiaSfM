<!DOCTYPE html>
<html lang="en" data-theme="__PYTHEIA_THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="generator" content="pyTheia viewer (three.js r160 inlined)">
<title>__PYTHEIA_TITLE__</title>
<style>
:root { --bg:#0f1115; --panel:#181b22; --fg:#e6e8ee; --muted:#9aa3b2; --accent:#4aa3ff; --border:#2a2f3a; --warn:#ff7a45; --sel:#2b3445; }
html[data-theme="light"] { --bg:#f5f6f8; --panel:#ffffff; --fg:#1b1f27; --muted:#5b6474; --accent:#1a6fd6; --border:#d9dde5; --warn:#d9531e; --sel:#dde7f7; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
#app { display:grid; grid-template-columns: 300px minmax(0,1fr); height:100%; }
#panel { overflow:auto; background:var(--panel); border-right:1px solid var(--border); padding:10px 12px; }
#panel h1 { font-size:15px; margin:4px 0 6px; }
#panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 6px; }
#summary div { margin:1px 0; }
.row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:5px 0; }
.row label { white-space:nowrap; }
.row input[type=range] { flex:1; min-width:0; }
.row select { flex:1; min-width:0; }
.val { min-width:52px; text-align:right; color:var(--muted); font-variant-numeric: tabular-nums; }
button { background:var(--sel); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:4px 8px; cursor:pointer; margin:2px 4px 2px 0; }
button:hover { border-color:var(--accent); }
#legend-bar { height:10px; border-radius:3px; border:1px solid var(--border); margin:4px 0; display:none; }
#legend-text, #filter-count, #views-summary, .muted { color:var(--muted); font-size:12px; }
#views-wrap { max-height:320px; overflow:auto; border:1px solid var(--border); border-radius:4px; margin-top:4px; }
table { border-collapse:collapse; width:100%; font-size:12px; }
#views th, #views td { padding:3px 5px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
#views thead th { position:sticky; top:0; background:var(--panel); cursor:pointer; user-select:none; }
#views tbody tr { cursor:pointer; }
#views tbody tr:hover, #views tbody tr.sel { background:var(--sel); }
.warn { color:var(--warn); font-weight:600; }
#view { position:relative; min-width:0; min-height:0; overflow:hidden; }
#info { position:absolute; right:10px; top:10px; width:330px; max-height:calc(100% - 60px); overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px; opacity:.97; }
#info .title { font-weight:600; font-size:14px; margin-bottom:6px; word-break:break-all; }
table.kv th { text-align:left; color:var(--muted); font-weight:normal; padding:2px 8px 2px 0; vertical-align:top; white-space:nowrap; }
table.kv td { padding:2px 0; word-break:break-word; }
table.grid { margin-top:8px; }
table.grid th, table.grid td { padding:2px 4px; border-bottom:1px solid var(--border); text-align:left; }
table.grid tbody tr { cursor:pointer; }
table.grid tbody tr:hover { background:var(--sel); }
.cmp { display:none; }
html[data-compare="1"] .cmp { display:table-cell; }
#views td.cmp, #views th.cmp { text-align:right; }
.cmp-line { color:var(--muted); }
.swatch { display:inline-block; width:12px; height:12px; border:1px solid var(--border); vertical-align:middle; }
#thumb img { display:block; max-width:100%; margin-top:8px; border:1px solid var(--border); border-radius:4px; }
#hint { position:absolute; left:10px; bottom:10px; background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:4px 8px; color:var(--muted); pointer-events:none; }
@media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); } #panel { max-height:45%; } }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>__PYTHEIA_TITLE__</h1>
    <div id="summary"></div>

    <h2>Points</h2>
    <div class="row"><label for="colorMode">Color</label>
      <select id="colorMode">
        <option value="rgb">RGB</option>
        <option value="track">Track length</option>
        <option value="error">Reprojection error</option>
        <option value="depth">Distance from camera / centroid</option>
      </select></div>
    <div id="legend-bar"></div>
    <div id="legend-text"></div>
    <div class="row"><label for="pointSize">Point size</label><input id="pointSize" type="range" min="1" max="10" step="0.5" value="2"><span id="pointSizeVal" class="val">2</span></div>
    <div class="row"><label for="minTrack">Min track length</label><input id="minTrack" type="range" min="1" max="2" step="1" value="1"><span id="minTrackVal" class="val">1</span></div>
    <div class="row"><label for="maxErr">Max error</label><input id="maxErr" type="range" min="0" max="1" step="0.01" value="1"><span id="maxErrVal" class="val">off</span></div>
    <div id="filter-count"></div>

    <h2>Show</h2>
    <div class="row" id="row-cams"><label><input id="showPoints" type="checkbox" checked> points</label><label><input id="showCams" type="checkbox" checked> cameras</label></div>
    <div class="row" id="row-frusta"><label><input id="showFrusta" type="checkbox" checked> image planes</label><label><input id="showUnreg" type="checkbox" checked> highlight unregistered</label></div>
    <div class="row" id="row-graph"><label><input id="showGraph" type="checkbox"> view graph</label></div>
    <div class="row" id="row-traj"><label><input id="showTraj" type="checkbox"> trajectory</label>
      <select id="trajOrder" aria-label="trajectory order"><option value="name">order: name</option><option value="id">order: view id</option></select></div>
    <div class="row" id="row-sets"><label><input id="setA" type="checkbox" checked> A</label><label><input id="setB" type="checkbox" checked> B (aligned)</label></div>
    <div class="row" id="row-nav"><label><input id="flyMode" type="checkbox"> fly mode (WASD)</label></div>
    <div class="row" id="row-measure"><label><input id="measure" type="checkbox"> measure (2 clicks)</label><button id="measure-clear" type="button">Clear</button></div>
    <div class="row"><label for="theme">Theme</label>
      <select id="theme"><option value="dark">dark</option><option value="light">light</option></select></div>
    <div>
      <button id="reset" type="button">Reset view</button>
      <button id="center-sel" type="button">Center on selection</button>
      <button id="screenshot" type="button">Screenshot (PNG)</button>
    </div>

    <h2>Views</h2>
    <div id="views-summary"></div>
    <div id="views-wrap">
      <table id="views">
        <thead><tr><th data-key="name">view</th><th data-key="est">registered</th><th data-key="obs">obs</th><th data-key="err">mean px</th><th data-key="cerr" class="cmp">center err</th><th data-key="rerr" class="cmp">rot deg</th></tr></thead>
        <tbody id="views-body"></tbody>
      </table>
    </div>
  </aside>
  <main id="view">
    <div id="info"><div id="info-body"></div></div>
    <div id="hint">Loading viewer...</div>
  </main>
</div>

<script type="text/plain" id="pytheia-three-b64">__PYTHEIA_THREE_B64__</script>

</body>
</html>
